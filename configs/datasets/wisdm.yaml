name: wisdm
raw_path : data/raw/wisdm/raw/
sensor_to_use : watch # To change it to phone if needed
out_dir : data/processed/wisdm/
out_dir_biopm : data/processed/wisdm_biopm/



label_cols :
  - "activity-label"

label_to_predict : "activity-label"
unknown_label_policy: raise

columns :
  timestamp : timestamp
  wrist :
    accel : [x, y, z]
    gyro : [gx, gy, gz]

acc_raw : [x, y, z]

selected_sensor : wrist

sampling_rate : 20
target_fs_biopm : 30

cutoff_noise : null
cutoff_gravity : 0.3

ffill_limit : 120



window_size : 512
step_size : 256

biopm:
  target_fs: 20
  ws_samples : 512

  normalize_size: 32
  pad_size: 192


label_mapping:
  activity-label:
    A: 0   # Walking
    B: 1   # Jogging
    C: 2   # Stairs
    D: 3   # Sitting
    E: 4   # Standing
    F: 5   # Typing
    G: 6   # Brushing Teeth
    H: 7   # Eating Soup
    I: 8   # Eating Chips
    J: 9   # Eating Pasta
    K: 10  # Drinking from Cup
    L: 11  # Eating Sandwich
    M: 12  # Kicking (Soccer Ball)
    O: 13  # Playing Catch w/ Tennis Ball
    P: 14  # Dribbling (Basketball)
    Q: 15  # Writing
    R: 16  # Clapping
    S: 17  # Folding Clothes